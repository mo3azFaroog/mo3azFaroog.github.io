<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Muaz Faroug</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .contact-form { text-align: start; display: grid; gap: 16px; margin: 8px 0 22px; }
    .form-field { display: grid; gap: 6px; }
    .form-field label { font-weight: 600; font-size: .92rem; color: var(--text); }
    .form-field input,
    .form-field textarea {
      width: 100%; font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-field textarea { min-height: 150px; resize: vertical; }
    .form-field input:focus,
    .form-field textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .2);
    }
    .form-field input::placeholder,
    .form-field textarea::placeholder { color: var(--muted); }
    /* spam trap: hidden from people, visible to bots */
    .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .contact-form .btn { justify-content: center; width: 100%; }
    .contact-form .btn[disabled] { opacity: .7; cursor: wait; transform: none; }
    .form-status { margin: 0; min-height: 1.4em; font-size: .95rem; text-align: center; }
    .form-status.ok { color: #22c55e; }
    .form-status.err { color: #f87171; }
    .contact-divider { margin: 6px 0 16px; color: var(--muted); font-size: .9rem; }
    .contact-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  </style>
</head>
<body class="contact-page" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="container">
    <div class="contact-card-wrapper" style="max-width: 600px; margin: auto;">
      <div class="section-header">
        <h2 class="section-title">Let's Connect</h2>
        <div class="title-underline"></div>
      </div>

      <div class="contact-cta-box">
        <h3>Send me a message</h3>
        <p>I usually respond within 24 hours for business inquiries and collaborations.</p>

        <form id="contact-form" class="contact-form" action="https://formspree.io/f/mrpeavlo" method="POST">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="How can I help?" required></textarea>
          </div>
          <div class="hp-field" aria-hidden="true">
            <label for="_gotcha">Leave this field empty</label>
            <input type="text" id="_gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary" id="form-submit">
            <i class="fa-solid fa-paper-plane"></i> Send Message
          </button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <p class="contact-divider">Or reach out directly</p>
        <div class="contact-actions">
          <a href="mailto:mo3az.faroog@gmail.com" class="btn btn-secondary contact-email-link">
            <i class="fa-solid fa-envelope"></i> mo3az.faroog@gmail.com
          </a>
          <a href="index.html" class="btn btn-secondary">Back to Main Page</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var form = document.getElementById('contact-form');
      var btn = document.getElementById('form-submit');
      var status = document.getElementById('form-status');
      var label = btn.innerHTML;

      function show(msg, ok) {
        status.textContent = msg;
        status.className = 'form-status ' + (ok ? 'ok' : 'err');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
        show('', true);

        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        }).then(function (res) {
          if (res.ok) {
            form.reset();
            show('Thank you! Your message was sent. I will get back to you soon.', true);
          } else {
            return res.json().then(function (data) {
              var msg = data && data.errors && data.errors.map(function (x) { return x.message; }).join(', ');
              show(msg || 'Something went wrong. Please try again or email me directly.', false);
            }, function () {
              show('Something went wrong. Please try again or email me directly.', false);
            });
          }
        }).catch(function () {
          show('Network error. Please try again or email me directly.', false);
        }).then(function () {
          btn.disabled = false;
          btn.innerHTML = label;
        });
      });
    })();
  </script>

</body>
</html>
